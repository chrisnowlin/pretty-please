[project]
name = "jina-rag-pipeline"
version = "2.0.0"
description = "RAG pipeline using Jina Embeddings v4 optimized for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.52.0",
    "torch>=2.6.0",
    "peft>=0.15.2",
    "torchvision",
    "pillow",
    "tqdm",
    "numpy",
    "huggingface-hub",
    "chromadb>=0.5.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "mlx>=0.24.0",
    "mlx-lm>=0.24.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    # Document layout analysis (Deepseek OCR)
    "python-pptx>=0.6.21",
    # PDF rendering for Deepseek loader
    "PyMuPDF>=1.24.0",
    "addict>=2.4.0",
    "easydict>=1.13",
    # Lesson plan export functionality (Phase 2)
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "pyyaml>=6.0",
    # Lesson persistence (Phase 3 - single user)
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "ipython",
    "httpx>=0.25.0",
]

# Distributed processing dependencies
distributed = [
    "redis>=5.0.0",
    "rq>=1.15.0",
]

# Deepseek-specific acceleration dependencies (install on supported GPUs)
deepseek = [
    "flash-attn==2.7.3; platform_system == 'Linux'",
]

# Production-scale inference extras
production = [
    "vllm>=0.8.5; platform_system == 'Linux'",
]

# All optional dependencies
all = [
    "jina-rag-pipeline[dev,distributed,deepseek,production]",
]

paddleocr = [
    "paddlepaddle==3.2.0",
    "paddleocr[doc-parser]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/jina_rag_pipeline"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
asyncio_mode = "auto"
testpaths = ["tests"]
